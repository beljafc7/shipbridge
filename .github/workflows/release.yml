name: Release ZIP

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build installable ZIP
        run: sh scripts/build-zip.sh
      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: build/*.zip
          generate_release_notes: true

